name: Entrega

# Cada commit da main que passa no CI vira imagens publicadas, e cada tag de
# versão, uma versão: as imagens são compiladas uma vez, testadas de ponta a
# ponta e publicadas — as mesmas que foram testadas — no GitHub Container
# Registry, com a proveniência assinada (ADR-0020).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']

# Uma entrega por vez em cada ramo ou tag. A que está publicando não é
# cancelada no meio: a seguinte espera.
concurrency:
  group: entrega-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  entrega:
    name: Imagens testadas e publicadas
    # Da main, só depois do CI verde de um push. Da tag, o CI do commit é
    # conferido no primeiro passo.
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: read # o CI do commit da tag
      contents: write # a release da versão
      packages: write # as imagens no registro
      id-token: write # a assinatura da proveniência
      attestations: write

    env:
      REVISAO: ${{ github.event.workflow_run.head_sha || github.sha }}
      E2E_WEB: http://localhost:5290
      E2E_PLANEJAMENTO: http://localhost:5281
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.REVISAO }}

      # A tag pode apontar para qualquer commit; só sai versão do que passou.
      - name: Conferir o CI do commit da versão
        if: github.event_name == 'push'
        run: |
          verdes=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REVISAO&status=success&per_page=1" --jq .total_count)
          if [ "$verdes" -eq 0 ]; then
            echo "::error::O commit $REVISAO não passou no CI: a versão $GITHUB_REF_NAME não sai."
            exit 1
          fi

      - name: Nomes e versões
        id: nomes
        run: |
          registro="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crm-obras"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            versao="${GITHUB_REF_NAME#v}"
            tags="$versao ${versao%.*} latest sha-${REVISAO::7}"
          else
            versao="0.1.0-main"
            tags="main sha-${REVISAO::7}"
          fi
          {
            echo "registro=$registro"
            echo "versao=$versao"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # As quatro do mesmo Dockerfile: as etapas em comum compilam uma vez.
      - name: Compilar as imagens
        env:
          REGISTRO: ${{ steps.nomes.outputs.registro }}
          VERSAO: ${{ steps.nomes.outputs.versao }}
        run: |
          for alvo in api processador migrador web; do
            docker buildx build . --load --target "$alvo" \
              --build-arg VERSAO="$VERSAO" --build-arg REVISAO="$REVISAO" \
              --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$REVISAO" \
              --label org.opencontainers.image.version="$VERSAO" \
              --tag "$REGISTRO-$alvo:candidata"
          done

      # As do CRM são as candidatas; as do planejamento-obras, as que ele
      # publicou, na versão que o compose.yaml fixa. Pronto é a API e o
      # processador do CRM, e a API do planejamento, onde a venda vira obra.
      - name: Subir a pilha com as imagens candidatas
        env:
          REGISTRO: ${{ steps.nomes.outputs.registro }}
          VERSAO: candidata
        run: |
          docker compose up --detach --no-build
          for porta in 5291 5292 5281; do
            curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors \
              "http://localhost:$porta/saude/pronta"
            echo
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Testar as imagens candidatas de ponta a ponta
        working-directory: e2e
        run: |
          npm ci
          npm run teste:imagens

      - name: Guardar o log da pilha
        if: failure()
        run: docker compose logs --no-color > compose.log

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: entrega-que-falhou
          path: |
            compose.log
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Derrubar a pilha
        if: always()
        run: docker compose down --volumes

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # As candidatas, já testadas, recebem os nomes de verdade e sobem. O
      # digest é o mesmo em todas as tags de uma imagem.
      - name: Publicar as imagens testadas
        id: publicacao
        env:
          REGISTRO: ${{ steps.nomes.outputs.registro }}
          TAGS: ${{ steps.nomes.outputs.tags }}
        run: |
          for alvo in api processador migrador web; do
            for tag in $TAGS; do
              docker tag "$REGISTRO-$alvo:candidata" "$REGISTRO-$alvo:$tag"
              docker push --quiet "$REGISTRO-$alvo:$tag"
            done
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REGISTRO-$alvo:${TAGS%% *}")
            echo "$alvo=${digest#*@}" >> "$GITHUB_OUTPUT"
            echo "- \`$REGISTRO-$alvo@${digest#*@}\`" >> imagens.md
          done
          cat imagens.md >> "$GITHUB_STEP_SUMMARY"

      # A proveniência diz de que commit e de que execução cada imagem saiu,
      # assinada pelo GitHub; quem baixa confere com `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.nomes.outputs.registro }}-api
          subject-digest: ${{ steps.publicacao.outputs.api }}
          push-to-registry: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.nomes.outputs.registro }}-processador
          subject-digest: ${{ steps.publicacao.outputs.processador }}
          push-to-registry: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.nomes.outputs.registro }}-migrador
          subject-digest: ${{ steps.publicacao.outputs.migrador }}
          push-to-registry: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.nomes.outputs.registro }}-web
          subject-digest: ${{ steps.publicacao.outputs.web }}
          push-to-registry: true

      - name: Criar a release da versão
        if: github.event_name == 'push'
        run: |
          {
            echo "As imagens desta versão, pelo digest:"
            echo
            cat imagens.md
          } > notas.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file notas.md
